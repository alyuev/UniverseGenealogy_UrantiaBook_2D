<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Космология личностей по Книге Урантии</title>
<style>
:root{--bg:#f6f7f9;--ink:#1d2433;--muted:#6b7280;--panel:#fff;--line:#e3e6eb;--accent:#5b3fa0;--hov:#f0ecfa;--dot:#d9dce2;--node:#fff;--nodeS:#c3c8d1;--nodeL:#f3f4f7;--edge:#8b93a1;--edgeHi:#5b3fa0;--svc:#43a047;--asc:#1e88e5;--tintA:.13;--lpA:.22;--unitA:.05;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161c;--ink:#e6e8ee;--muted:#9aa1ad;--panel:#1d2028;--line:#2e323d;--accent:#b49cf0;--hov:#2b2540;--dot:#2a2e38;--node:#232733;--nodeS:#3a3f4d;--nodeL:#2b303d;--edge:#6f7889;--edgeHi:#c3adff;--svc:#5cc165;--asc:#64b5f6;--tintA:.2;--lpA:.32;--unitA:.09;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161c;--ink:#e6e8ee;--muted:#9aa1ad;--panel:#1d2028;--line:#2e323d;--accent:#b49cf0;--hov:#2b2540;--dot:#2a2e38;--node:#232733;--nodeS:#3a3f4d;--nodeL:#2b303d;--edge:#6f7889;--edgeHi:#c3adff;--svc:#5cc165;--asc:#64b5f6;--tintA:.2;--lpA:.32;--unitA:.09;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:14px/1.4 system-ui,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
header{position:fixed;top:0;left:0;right:0;height:56px;display:flex;gap:12px;align-items:center;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);z-index:5}
header h1{font-size:15px;line-height:1.15;margin:0;white-space:nowrap}
#searchBox{position:relative;flex:1;max-width:460px}
#q{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--bg);color:var(--ink)}
#q:focus{outline:2px solid #c9b8f0;border-color:#a08ad8}#q{padding-right:36px}
#qx{position:absolute;right:2px;top:50%;transform:translateY(-50%);border:0;background:none;width:32px;height:32px;padding:0;font-size:19px;line-height:1;color:var(--muted)}
#q:placeholder-shown~#qx{display:none} /* крестик виден, только когда в поиске есть текст */
#res{position:absolute;top:40px;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px #0002;max-height:60vh;overflow:auto;display:none}
#res div{padding:6px 10px;cursor:pointer;display:flex;gap:8px;align-items:center}
#res div.on,#res div:hover{background:var(--hov)}
#res small{color:var(--muted);margin-left:auto}
header label{white-space:nowrap;color:var(--muted);font-size:13px}
#map{position:fixed;top:56px;left:0;right:0;bottom:0;width:100%;height:calc(100% - 56px);cursor:grab;touch-action:none;
 background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:20px 20px}
#map.panning{cursor:grabbing}
#map,#map *,header h1,#legend{-webkit-user-select:none;user-select:none}
.unit rect.box{stroke-width:1.5}
.unit text{font-size:13px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round} /* обводка цветом фона — линии связей не просвечивают сквозь буквы */
.node{cursor:pointer}
.split{position:fixed;z-index:4;background:var(--bg);opacity:0;transition:opacity .3s;pointer-events:auto;}.split.on{opacity:1}
.split{clip-path:inset(8px round 12px)}.split::after{content:"";position:absolute;inset:8px;border:1px solid var(--muted);border-radius:12px;box-shadow:inset 0 0 18px #0004;pointer-events:none} /* вторая часть экрана — окно-карточка; геометрия прежняя, поэтому линии связей совпадают */
.flyov{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:6;pointer-events:none;overflow:visible}.flyov .node{filter:drop-shadow(0 8px 14px #0005)}
.runner{fill:var(--accent);filter:drop-shadow(0 0 5px var(--accent));pointer-events:none}
.split svg{width:100%;height:100%;display:block}
.node.stage rect.body{stroke-dasharray:4 3;stroke-width:1.6;stroke:#43a047}.node.stage .tint{fill-opacity:0}.node.stage .lp{fill-opacity:.25}
.node.corps .stack{fill:var(--panel);stroke:var(--nodeS);stroke-width:1}
.node.ghost{opacity:.55}.node.ghost rect.body{stroke-dasharray:5 4}.gtag{font-size:10px!important;fill:var(--muted)!important;font-style:italic}
.pair{fill:none;stroke:#9a6fc4;stroke-opacity:.7;stroke-width:1.6}.pair.ghost{stroke-dasharray:6 5;stroke-opacity:.5}
.node.fly{pointer-events:none;filter:drop-shadow(0 8px 14px #0005)}
.node rect.body{fill:var(--node);stroke:var(--nodeS);stroke-width:1.2} /* без тени: фильтр на каждой карточке тормозит панораму и зум */
.node:hover rect.body,.node:hover rect.stack{stroke:var(--accent)}
.node .tint{fill-opacity:var(--tintA);pointer-events:none}.node .lp{fill-opacity:var(--lpA)}.node .sep{stroke:var(--nodeS)}
.unit rect.box{fill-opacity:var(--unitA)}
.node text{font-size:12px;fill:var(--ink);pointer-events:none}
.node.sel rect.body,.node.sel rect.stack{stroke:var(--accent);stroke-width:2.5}
.edge path.halo{fill:none;stroke:var(--bg);stroke-width:6;stroke-linejoin:round}
.edge path.line{fill:none;stroke-width:1.5;stroke-linejoin:round;transition:stroke .2s,stroke-width .2s}
.edge.origin path.line{stroke:var(--edge)}
.edge.service path.line{stroke:var(--svc);stroke-dasharray:6 4}
.edge.ascent path.line{stroke:var(--asc);stroke-width:2;stroke-dasharray:1 4;stroke-linecap:round}
.edge.ascent.hi path.line,.edge.ascent.he1 path.line{stroke:var(--asc)!important}
svg.hideAscent .edge.ascent{display:none}
svg.far .node text,svg.far .gtag{display:none}svg.far .unit text{font-size:28px;font-weight:600}svg.far .node:not(.h0):not(.h1):not(.h2) rect.body{stroke-width:2}
svg:not(.showLong) .edge.long:not(.he1):not(.he2):not(.hi){display:none}
.edge.hi path.line{stroke-width:2.6}
.edge.origin.hi path.line{stroke:var(--edgeHi)}
.edge.service.hi path.line{stroke:var(--svc);stroke-width:3}
.node,.edge,.unit{transition:opacity .35s}
svg.dim .node:not(.hi){opacity:.14}
svg.dim .edge:not(.hi){opacity:.06}
svg.dim .unit{opacity:.55}
svg.hideOrigin .edge.origin,svg.hideService .edge.service{display:none}
/* --- наведение: блоки --- */
.unit rect.box{transition:fill-opacity .25s,stroke-width .25s,stroke-opacity .25s}
.unit:hover rect.box{fill-opacity:calc(var(--unitA) * 2.6);stroke-width:2.6;stroke-opacity:1}
.unit text{transition:opacity .25s}.unit:hover text{opacity:1;font-weight:700}
/* --- наведение: личность (градация h0 > h1 > h2) --- */
.node rect.body,.node rect.stack{transition:stroke .2s,stroke-width .2s,filter .25s}
svg.hovering .node:not(.h0):not(.h1):not(.h2){opacity:.28}
svg.hovering .edge:not(.he1):not(.he2){opacity:.08}
svg.hovering .node.h0,svg.hovering .node.h1,svg.hovering .node.h2,svg.hovering .edge.he1,svg.hovering .edge.he2{opacity:1!important}
.node.h0 rect.body,.node.h0 rect.stack{stroke:var(--accent);stroke-width:2.8;filter:drop-shadow(0 0 7px var(--accent))}
.node.h1 rect.body,.node.h1 rect.stack{stroke:var(--accent);stroke-width:1.8;filter:drop-shadow(0 0 3px var(--accent))}
.node.h2 rect.body,.node.h2 rect.stack{stroke:var(--accent);stroke-width:2.2;stroke-dasharray:6 3;filter:drop-shadow(0 0 2px var(--accent))}
.edge.he1 path.line{stroke:var(--edgeHi)!important;stroke-width:2.8}
.edge.he2 path.line{stroke:var(--edgeHi)!important;stroke-width:2.2;stroke-opacity:.85}
.pulse{fill:none;stroke:#5b3fa0;stroke-width:3;animation:pulse 1.2s ease-out 2}
@keyframes pulse{from{opacity:1;stroke-width:6}to{opacity:0;stroke-width:1;transform:scale(1.25)}}
aside{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px #0001;z-index:4}
#legend{left:16px;bottom:16px;width:270px;font-size:13px;max-height:calc(100% - 100px);display:flex;flex-direction:column;overflow:hidden}
#legend h3{font-size:12px;text-transform:uppercase;color:var(--muted);margin:12px 0 6px;letter-spacing:.05em}
.lhead{display:flex;gap:4px;padding:8px 8px 4px;align-items:center;flex:none}
.tab{border:0;background:none;padding:6px 10px;font-size:13px;font-weight:600;color:var(--muted)}
#legend:not(.k) .tab[data-tab=f],#legend.k .tab[data-tab=k]{background:var(--hov);color:var(--accent)}
#lgToggle{margin-left:auto;border:0;background:none;font-size:16px;padding:4px 8px;display:flex;gap:6px;align-items:center}
#lgToggle b::before{content:'–'}#legend.min #lgToggle b::before{content:'☰'}
#lgToggle span{font-size:13px;font-weight:600;display:none}
.lbody{padding:0 14px 12px;overflow:auto;overscroll-behavior:contain}
#legend.min{width:auto}#legend.min .tab,#legend.min .lbody{display:none}#legend.min .lhead{padding:4px}#legend.min #lgToggle span{display:inline}
#legend:not(.k) #tabK,#legend.k #tabF{display:none}
#key .row{gap:10px;margin:1px 0}#key svg{flex:none}
#found{display:none;margin:8px 0 4px;border:1px solid var(--line);border-radius:10px;overflow:hidden}#found.on{display:block}
#found b{display:flex;align-items:center;gap:6px;padding:7px 6px 7px 10px;background:var(--hov)}
#found b button,#active button{margin-left:auto;border:0;background:none;padding:0 6px;font-size:17px;line-height:1}
#found ul{list-style:none;margin:0;padding:0;max-height:200px;overflow:auto;overscroll-behavior:contain}
#found li{padding:5px 10px;cursor:pointer;border-top:1px solid var(--line)}#found li:hover,#found li.on{background:var(--hov)}
#active{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:4;display:none;align-items:center;gap:7px;padding:4px 4px 4px 12px;border-radius:999px;background:var(--panel);
 border:1px solid var(--accent);box-shadow:0 4px 16px #0002;font-size:13px;cursor:pointer;max-width:calc(100% - 16px);white-space:nowrap}
#active.on{display:flex}#active i{width:10px;height:10px;border-radius:3px;flex:none;box-shadow:0 0 0 1px #0003}#active span{overflow:hidden;text-overflow:ellipsis}#active small{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);margin:2px;cursor:pointer;font-size:12px;background:var(--panel);color:var(--ink)}
body:not(.edit) .edit-only{display:none!important}
button.ico{padding:4px 7px;line-height:0;font-size:16px;min-width:34px;height:30px}button.ico svg{border-radius:2px;box-shadow:0 0 0 1px #0003}
.chip i{width:10px;height:10px;border-radius:3px;display:inline-block;box-shadow:0 0 0 1px #0003}
.chip.on{background:var(--hov);border-color:#a08ad8}
.row{display:flex;align-items:center;gap:8px;margin:3px 0}
button{font:inherit;font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);cursor:pointer}
button:hover{background:var(--hov)}
select{font:inherit;font-size:13px;padding:5px 6px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink)}
#status{color:var(--muted);font-size:12px;margin-top:6px}
#card{right:16px;top:72px;width:330px;display:none;flex-direction:column;max-height:calc(100% - 90px);overflow:hidden}
.chead{position:relative;padding:14px 46px 8px 16px;flex:none}.cbody{padding:0 16px 16px;overflow:auto;overscroll-behavior:contain}
.grip{display:none;position:absolute;left:50%;top:7px;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--nodeS)}
#card h2{margin:0 0 2px;font-size:18px;line-height:1.25}
#card .en{color:var(--muted);font-size:12px}
#card .aka{font-size:14px;font-weight:600;margin:0 0 2px}
#card .bk{display:block;border:0;background:none;padding:0 0 6px;color:var(--accent);font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#card dl{margin:0}
#card.peek{cursor:pointer}#card.peek,#card.peek *{touch-action:none}#card.peek dl,#card.peek .bk{display:none}#card.peek .cbody{overflow:hidden;padding-bottom:12px}
#card.peek .desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#card dt{font-size:11px;text-transform:uppercase;color:var(--muted);margin-top:10px;letter-spacing:.05em}
#card dd{margin:2px 0}
#card a{color:var(--accent);cursor:pointer;text-decoration:none;border-bottom:1px dotted}
#card .x{position:absolute;right:8px;top:8px;border:0;font-size:20px;background:none;width:32px;height:32px;padding:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px}
#zoomBox{display:flex;align-items:center;gap:6px;white-space:nowrap}
#zoomBox button{width:30px;height:30px;padding:0;line-height:1;font-size:15px;display:flex;align-items:center;justify-content:center}
#zoom{width:110px;accent-color:var(--accent)}
#bLang{font-weight:600;font-size:12px;line-height:1;letter-spacing:.04em}
#guide{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);z-index:20;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;
 box-shadow:0 12px 40px #0004;padding:16px 20px;display:none;align-items:center;gap:18px;max-width:min(560px,calc(100% - 32px))}
#guide #gTouch{display:none}#guide.touch #gTouch{display:block}#guide.touch #gMouse{display:none}
#guide.pinch .f1{animation:pa 1.4s ease-in-out infinite}#guide.pinch .f2{animation:pb 1.4s ease-in-out infinite}
@keyframes pa{0%,100%{transform:translate(-4px,4px)}50%{transform:translate(-16px,16px)}}@keyframes pb{0%,100%{transform:translate(4px,-4px)}50%{transform:translate(16px,-16px)}}
#guide.pan .f2,#guide.tap .f2{display:none}#guide.pan .f1{animation:pn 1.6s ease-in-out infinite}@keyframes pn{0%,100%{transform:translateY(16px)}50%{transform:translateY(-16px)}}
#guide.tap .f1{animation:tp 1.2s ease-in-out infinite;transform-origin:35px 43px}@keyframes tp{0%,60%,100%{transform:scale(1);opacity:1}30%{transform:scale(.6);opacity:.5}}
#guide.on{display:flex}#guide p{margin:0 0 10px;font-size:15px;line-height:1.4}#guide .gb{display:flex;gap:8px;justify-content:flex-end}
#guide .key{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}#guide .kt{font:600 13px system-ui;fill:var(--ink)}
#guide .key.off,#guide .kt.off{opacity:.15}
#guide .whl{animation:whl 1.1s ease-in-out infinite}@keyframes whl{0%,100%{transform:translateY(-3px)}50%{transform:translateY(4px)}}
/* Телефон: описание и фильтры — нижние листы. */
@media (max-width:700px){#zoomBox #zoom,#zoomBox #bHelp{display:none}#zoomBox{gap:4px}header{gap:4px;padding:0 6px}#searchBox{min-width:0}header h1{display:none}#active{top:62px}
 #legend{left:0;right:0;bottom:0;width:auto;max-height:60%;border-radius:16px 16px 0 0;border-bottom:0;box-shadow:0 -6px 24px #0003}
 #legend.min{left:8px;right:auto;bottom:8px;border-radius:999px;border-bottom:1px solid var(--line);box-shadow:0 6px 24px #0002}
 #card{left:0;right:0;width:auto;top:auto;bottom:0;max-height:72%;border-radius:16px 16px 0 0;border-bottom:0;box-shadow:0 -6px 24px #0003}
 .chead{touch-action:none;padding-top:20px}.grip{display:block}
 #searchBox #res{position:fixed;left:6px;right:6px;top:54px;max-height:45vh}} /* список поиска — во всю ширину экрана, а не поля */
/* Палец: цели не меньше 40px. */
@media (pointer:coarse),(max-width:700px){.chip{padding:8px 12px;font-size:13px;margin:3px}button{min-height:40px;min-width:40px}#zoomBox button{width:40px;height:40px}
 #q{padding:10px 12px;font-size:16px}#res{top:46px}#res div{padding:11px 12px}#legend .row{margin:10px 0}#key .row{margin:1px 0}#found li{padding:10px}.tab{padding:8px 12px}}
.stg{margin:10px 0 4px;font-size:13px}.stg ol{margin:4px 0 0;padding-left:20px}.stg li{margin:3px 0}.stg small{color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1 data-i18n-html="h1">Космология личностей<br>по Книге Урантии</h1>
  <div id="searchBox"><input id="q" data-i18n-ph="search" placeholder="Поиск: личность или категория…" autocomplete="off"><button id="qx" type="button" data-i18n-title="clear">×</button><div id="res"></div></div>
  <div id="zoomBox"><button id="zOut" title="−">−</button><input type="range" id="zoom" min="0" max="1000" step="1"><button id="zIn" title="+">+</button><button id="bFit" data-i18n-title="fit"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 5V1h4M9 1h4v4M13 9v4H9M5 13H1V9"/></svg></button><button id="bHelp" data-i18n-title="help" title="?">?</button></div>
  <input type="checkbox" id="dimToggle" checked hidden>
  <button id="bLang" title="Язык / Language"></button>
  <button id="bTheme" class="ico"></button>
</header>
<div id="guide"><svg id="gTouch" width="70" height="86" viewBox="0 0 70 86"><rect x="8" y="2" width="54" height="82" rx="9" fill="none" stroke="currentColor" stroke-width="2"/>
<circle class="f1" cx="35" cy="43" r="7" fill="var(--accent)" fill-opacity=".75"/><circle class="f2" cx="35" cy="43" r="7" fill="var(--accent)" fill-opacity=".75"/></svg><svg id="gMouse" width="96" height="86" viewBox="0 0 96 86"><rect class="key" id="gKey" x="2" y="30" width="38" height="26" rx="5"/><text class="kt" id="gKt" x="21" y="48" text-anchor="middle">Ctrl</text>
<text x="46" y="48" class="kt" id="gPl" text-anchor="middle">+</text><rect x="54" y="8" width="38" height="68" rx="19" fill="none" stroke="currentColor" stroke-width="2"/><line x1="54" y1="36" x2="92" y2="36" stroke="currentColor" stroke-width="1.5"/>
<line x1="73" y1="8" x2="73" y2="36" stroke="currentColor" stroke-width="1.5"/><rect class="whl" x="70" y="16" width="6" height="12" rx="3" fill="var(--accent)"/></svg>
<div><p id="gTxt"></p><div class="gb"><button id="gSkip"></button><button id="gNext"></button></div></div></div>
<svg id="map" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" fill="context-stroke"/>
    </marker>
  </defs>
  <g id="world"><g id="gUnits"></g><g id="gPairs"></g><g id="gEdges"></g><g id="gULab"></g><g id="gNodes"></g><g id="gFx"></g></g>
</svg>
<aside id="legend">
  <div class="lhead"><button class="tab" data-tab="f" data-i18n="tabF"></button><button class="tab" data-tab="k" data-i18n="tabK"></button><button id="lgToggle"><b></b><span data-i18n="tabF"></span></button></div>
  <div class="lbody">
  <div id="tabF">
  <div id="found"></div>
  <h3><span data-i18n="cats">Категории</span> <small style="text-transform:none;color:#999" data-i18n="catsHint">(клик — выделить)</small></h3>
  <div id="cats"></div>
  <h3 data-i18n="funcs">Функции</h3>
  <div id="funcs"></div>
  <h3 data-i18n="classes">Класс (заливка карточки)</h3>
  <div id="classes"></div>
  <h3 data-i18n="links">Связи</h3>
  <div class="row"><label><input type="checkbox" id="tOrigin" checked> <svg width="30" height="8"><line x1="0" y1="4" x2="30" y2="4" stroke="#8b93a1" stroke-width="2"/></svg> <span data-i18n="lOrigin">происхождение</span></label></div>
  <div class="row"><label><input type="checkbox" id="tService" checked> <svg width="30" height="8"><line x1="0" y1="4" x2="30" y2="4" stroke="#43a047" stroke-width="2" stroke-dasharray="6 4"/></svg> <span data-i18n="lService">служение / пребывание</span></label></div>
  <div class="row"><label><input type="checkbox" id="tLong"> <span data-i18n="lLong">дальние связи всегда</span></label></div>
  <div class="row"><label><input type="checkbox" id="tAscent" checked> <svg width="30" height="8"><line x1="2" y1="4" x2="30" y2="4" stroke="#1e88e5" stroke-width="2.5" stroke-dasharray="1 4" stroke-linecap="round"/></svg> <span data-i18n="lAscent">восхождение</span></label></div>
  </div>

 <div class="cbody"><div class="desc">${p.desc||''}</div>${p.stages?`<div class="stg"><b>${t('cStages')}</b><ol>${p.stages.map(x=>`<li>${x.id&&byId[x.id]?x.t.replace(/^[^—]+/,m=>link(x.id).replace(byId[x.id].name,m.trim())+' '):x.t} <small>${x.ref}</small></li>`).join('')}</ol></div>`:''}<dl>
 ${SERVES[p.id]?row('serves',`${unitById[GHOSTS['~'+p.id].unit].name} — ${L(SERVES[p.id])}${PAIR_OF[p.id]?'; '+t('pairT')+': '+byId[PAIR_OF[p.id]].name:''}`):''}
 ${row('cParents',par)}${row('cChildren',ch)}${row('lService',sv)}${row('lAscent',as)}

 ${p.cats?row('cats',p.cats.map(k=>`<span class="chip" data-cat="${k}"><i style="background:${CATS[k].color}"></i>${CATS[k].name}</span>`).join('')):''}
 ${p.fn?row('funcs',p.fn.map(k=>`<span class="chip" data-cat="fn:${k}"><i style="background:${FUNCS[k].color};border-radius:2px"></i>${FUNCS[k].name}</span>`).join('')):''}
 ${row('cOrigin',orig)}
 ${p.ref?row('cSource',t('book')+', '+p.ref):''}</dl></div>`;

/* Краткий вид: касание раскрывает описание. На телефоне лист тянется за заголовок: вверх — раскрыть, вниз — свернуть, ещё раз вниз — закрыть. */
let cs=null;

card.addEventListener('pointerup',e=>{if(!cs)return;const dy=e.clientY-cs.y,pk=card.classList.contains('peek');cs=null;
 if(dy>30){if(pk){hover(null,0,1);closeCard()}else card.classList.add('peek')}
 else if(pk&&dy<10)select(card.dataset.id,{hist:1});else if(dy<-30)card.classList.remove('peek')});

 const i=catInfo(selCat),ids=[...catSet(selCat)].sort((x,y)=>byId[x].y-byId[y].y||byId[x].x-byId[y].x); // в порядке схемы: сверху вниз
 a.innerHTML=`<i style="background:${i.color}"></i><span>${i.name}</span><small>${ids.length}</small><button title="${t('close')}">×</button>`;
 f.innerHTML=`<b><i class="dot" style="background:${i.color};border-radius:3px"></i>${i.name} · ${ids.length}<button title="${t('close')}">×</button></b><ul>${ids.map(x=>`<li data-id="${x}"${x===sel?' class="on"':''}>${byId[x].name}</li>`).join('')}</ul>`}
document.getElementById('active').onclick=e=>{if(e.target.tagName==='BUTTON')return clearSel();const lg=document.getElementById('legend');lg.classList.remove('min','k');lg.querySelector('.lbody').scrollTop=0}; // открыть список найденного
document.getElementById('found').onclick=e=>{if(e.target.tagName==='BUTTON')return clearSel();const li=e.target.closest('li');if(li)select(li.dataset.id)};
function drawKey(){const k=document.getElementById('key');k.innerHTML='';
 [['kDeity','deity','F'],['kTrin','trin','T'],['kDesc','desc','FS'],['kAngel','angel','D'],['kSpirit','spirit','D'],['kLocal','local','SD'],['kAsc','asc','E']].forEach(([key,c,o])=>{
  const d=document.createElement('div');d.className='row';originGlyph(el('svg',{width:30,height:34,viewBox:'-17 -19 34 38'},d),{origin:o,cats:[c]},0,0);
  d.appendChild(document.createElement('span')).textContent=t(key);k.appendChild(d)})}
function drawCats(){document.getElementById('classes').innerHTML=Object.entries(OCLS).map(([k,c])=>`<span class="chip" data-cat="oc:${k}"><i style="background:${c.color};opacity:.55"></i>${L(c.name)} <small>${persons.filter(p=>p.oc===k).length}</small></span>`).join('');
 document.querySelectorAll('#classes .chip').forEach(c=>c.onclick=()=>selectCat(c.dataset.cat));
 document.getElementById('cats').innerHTML=Object.entries(CATS).map(([k,c])=>`<span class="chip" data-cat="${k}"><i style="background:${c.color}"></i>${c.name} <small>${persons.filter(p=>p.cats.includes(k)).length}</small></span>`).join('');
document.querySelectorAll('#cats .chip').forEach(c=>c.onclick=()=>selectCat(c.dataset.cat));
 document.getElementById('funcs').innerHTML=Object.entries(FUNCS).map(([k,c])=>`<span class="chip" data-cat="fn:${k}"><i style="background:${c.color};border-radius:2px"></i>${c.name} <small>${persons.filter(p=>p.fn.includes(k)).length}</small></span>`).join('');
 document.querySelectorAll('#funcs .chip').forEach(c=>c.onclick=()=>selectCat(c.dataset.cat));markChips()}
// поиск
const q=document.getElementById('q'),res=document.getElementById('res');let items=[],cur=0;
const norm=s=>s.toLowerCase().replace(/ё/g,'е');
function doSearch(){const s=norm(q.value.trim());
 const all=[...Object.entries(CATS).map(([k,c])=>({kind:'cat',id:k,name:c.name,hint:t('catWord'),color:c.color})),
  ...Object.entries(FUNCS).map(([k,c])=>({kind:'cat',id:'fn:'+k,name:c.name,hint:t('funcs'),color:c.color})),
  {kind:'node',id:'trinity',name:byId.trinity.name,all:allNames(byId.trinity),hint:byId.paradise.name},
  ...persons.map(p=>({kind:'node',id:p.id,name:p.name,all:allNames(p),hint:unitById[p.unit].name.split(' — ')[0],color:CATS[p.cats[0]].color}))];
 items=s?all.filter(i=>norm(i.name+' '+(i.all||'')).includes(s)):all;cur=0;
 res.innerHTML=items.map((i,n)=>`<div data-n="${n}" class="${n===0?'on':''}"><span class="dot" style="background:${i.color||'#7b3fa0'};${i.kind==='cat'?'border-radius:3px':''}"></span>${i.name}<small>${i.hint}</small></div>`).join('')||`<div style="color:#999">${t('none')}</div>`;
 res.style.display='block';res.querySelectorAll('[data-n]').forEach(d=>d.onmousedown=e=>{e.preventDefault();pick(items[+d.dataset.n])})}
function pick(i){if(!i)return;res.style.display='none';q.blur();selCat=null;i.kind==='cat'?selectCat(i.id):select(i.id)}
q.addEventListener('input',doSearch);q.addEventListener('focus',doSearch);q.addEventListener('blur',()=>setTimeout(()=>res.style.display='none',150));
q.addEventListener('keydown',e=>{const ds=res.querySelectorAll('[data-n]');if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();cur=(cur+(e.key==='ArrowDown'?1:-1)+ds.length)%ds.length;ds.forEach((d,n)=>d.classList.toggle('on',n===cur));ds[cur]?.scrollIntoView({block:'nearest'})}
 else if(e.key==='Enter')pick(items[cur]);else if(e.key==='Escape'){q.value='';res.style.display='none';clearSel()}});
document.getElementById('qx').onclick=()=>{q.value='';res.style.display='none';clearSel()}; // очистить поиск мышью и снять выбранное через него; список не открывается
document.getElementById('tLong').onchange=e=>svg.classList.toggle('showLong',e.target.checked);
document.getElementById('tOrigin').onchange=e=>svg.classList.toggle('hideOrigin',!e.target.checked);
document.getElementById('tAscent').onchange=e=>svg.classList.toggle('hideAscent',!e.target.checked);
document.getElementById('tService').onchange=e=>svg.classList.toggle('hideService',!e.target.checked);

/* ===================== РАСКЛАДКА: сохранение / экспорт ===================== */
// Ручные позиции привязаны к «отпечатку» дерева раскладки: изменилось дерево — старые позиции игнорируются.
const LAYOUT_SIG=(()=>{const str=JSON.stringify(TREE,(k,v)=>k==='parent'||k==='_name'||k==='_desc'?undefined:v).replace(/"(x|y|w|h|lw)":\d+(\.\d+)?,?/g,'');let h=0;for(const ch of str)h=(h*31+ch.charCodeAt(0))|0;return (h>>>0).toString(36)})();
try{Object.keys(localStorage).filter(k=>k.startsWith('ku-cosmo-proto-pos')).forEach(k=>localStorage.removeItem(k))}catch(e){}
const KEY='ku-cosmo-pos-'+LAYOUT_SIG,DEF={};persons.forEach(p=>DEF[p.id]=[p.x,p.y]);
const undoStack=[];
function updUndo(){const b=document.getElementById('bUndo');b.disabled=!undoStack.length;document.getElementById('undoN').textContent=undoStack.length?'('+undoStack.length+')':''}
function undo(){const u=undoStack.pop();if(!u)return;const p=persons.find(q=>q.id===u.id);p.x=u.x;p.y=u.y;nodeEl[p.id].setAttribute('transform',`translate(${p.x},${p.y})`);updUndo();savePos();routeAll();drawEdges();reapply();pulse&&pulse(p.id)}
document.getElementById('bUndo').onclick=undo;
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.code==='KeyZ'&&EDIT&&e.target.tagName!=='INPUT'){e.preventDefault();undo()}});
function savePos(){try{localStorage.setItem(KEY,JSON.stringify(Object.fromEntries(persons.map(p=>[p.id,[p.x,p.y]]))))}catch(e){}}
if(EDIT)try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)persons.forEach(p=>{if(s[p.id])[p.x,p.y]=s[p.id]})}catch(e){}
document.getElementById('bExport').onclick=()=>{const b=new Blob([JSON.stringify(Object.fromEntries(persons.map(p=>[p.id,[p.x,p.y]])),null,1)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='layout.json';a.click()};
document.getElementById('bReset').onclick=()=>{persons.forEach(p=>[p.x,p.y]=DEF[p.id]);undoStack.length=0;updUndo();try{localStorage.removeItem(KEY)}catch(e){};render()};
document.getElementById('bFit').onclick=()=>flyTo({x:0,y:0,w:W,h:H},1);

function render(){drawUnits();drawNodes();drawGhosts();routeCached();drawEdges();reapply()}
/* ===================== ЯЗЫК И ТЕМА: переключение ===================== */
function applyLang(){document.documentElement.lang=LANG;document.title=t('title');
 document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
 document.querySelectorAll('[data-i18n-html]').forEach(e=>e.innerHTML=t(e.dataset.i18nHtml));
 document.querySelectorAll('[data-i18n-ph]').forEach(e=>e.placeholder=t(e.dataset.i18nPh));
 document.querySelectorAll('[data-i18n-title]').forEach(e=>e.title=t(e.dataset.i18nTitle));
 drawCats();drawKey();drawActive();updThemeBtn();updLangBtn?.();document.getElementById('ver').textContent=(LANG==='ru'?'Версия ':'Version ')+(D.meta.version||'')}
/* Язык — код текущего языка (щелчок переключает), тема — пиктограмма: светлая / тёмная. */
const bLang=document.getElementById('bLang'),LANGS=Object.keys(UI);
function updLangBtn(){bLang.textContent=LANG.toUpperCase();bLang.title=UI[LANG]._name+' → '+UI[LANGS[(LANGS.indexOf(LANG)+1)%LANGS.length]]._name}
bLang.onclick=()=>{LANG=LANGS[(LANGS.indexOf(LANG)+1)%LANGS.length];store.set('ku-lang',LANG);applyLang();render();if(sel)showCard(sel)};
let THEME=qs.get('theme')||store.get('ku-theme');if(THEME!=='light'&&THEME!=='dark')THEME=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
function applyTheme(){document.documentElement.setAttribute('data-theme',THEME);updThemeBtn()}

document.getElementById('bTheme').onclick=()=>{THEME=THEME==='dark'?'light':'dark';store.set('ku-theme',THEME);applyTheme()};
applyTheme();applyLang();render();
let seen=0;try{const v=JSON.parse(localStorage.getItem('ku-view')||'null');if(v&&[v.x,v.y,v.w,v.h].every(Number.isFinite)&&v.w>0){vb=v;seen=1}}catch(e){}
if(!seen){const cw=svg.clientWidth||1,w=Math.min(W,Math.max(700,cw/.6)),T=unitById.trinity; // первый вход: верх Рая в читаемом масштабе, а не вся схема
 vb={x:Math.min(Math.max(0,T.x+T.w/2-w/2),W-w),y:0,w,h:w*svg.clientHeight/cw}}
setVB();
const hashId=()=>{try{return decodeURIComponent(location.hash.slice(1))}catch(e){return''}};
if(byId[hashId()])select(hashId());
window.addEventListener('hashchange',()=>{const h=hashId();if(h!==sel&&byId[h])select(h)});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.key==='Escape'){hover(null,0,1);cardShown()?closeCard():clearSel()}
 else if(e.code==='Slash'){e.preventDefault();q.focus()}else if(e.code==='Digit0')document.getElementById('bFit').click()});

/* ===================== ЗУМ: бегунок и гайд при первом открытии ===================== */
var ZMIN=250,ZMAX=W*3,zEl=document.getElementById('zoom');
function syncZoom(){if(zEl)zEl.value=Math.round(1000*Math.log(ZMAX/(tv||vb).w)/Math.log(ZMAX/ZMIN))} // по цели: бегунок не спорит с рукой
function zoomTo(w){const b=tv||vb;w=Math.min(Math.max(w,ZMIN),ZMAX);const h=b.h*w/b.w;easeTo({x:b.x+b.w/2-w/2,y:b.y+b.h/2-h/2,w,h})}
zEl.addEventListener('input',()=>zoomTo(ZMAX/Math.pow(ZMAX/ZMIN,zEl.value/1000)));
document.getElementById('zIn').onclick=()=>zoomTo((tv||vb).w/1.4);document.getElementById('zOut').onclick=()=>zoomTo((tv||vb).w*1.4);
syncZoom();
const guide=document.getElementById('guide');let gStep=0,gTok=0;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
// плавный переход вида; прерывается, если гайд закрыт или перешёл к другому шагу
function animVB(to,D,tok){stopEase();const fr={...vb},t0=performance.now();return new Promise(res=>{const st=now=>{if(tok!==gTok)return res();
 const t=Math.min(1,(now-t0)/D),e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;vb={x:fr.x+(to.x-fr.x)*e,y:fr.y+(to.y-fr.y)*e,w:fr.w+(to.w-fr.w)*e,h:fr.h+(to.h-fr.h)*e};setVB();
 t<1?requestAnimationFrame(st):res()};requestAnimationFrame(st)})}
const around=(id,w)=>{const r=rectOf(id),h=w*svg.clientHeight/svg.clientWidth;return{x:r.x+r.w/2-w/2,y:r.y+r.h/2-h/2,w,h}};
async function demoZoom(tok){const far={...vb},near=around('michael',TOUCH?520:1100);
 for(let k=0;k<2&&tok===gTok;k++){await animVB(near,1400,tok);await sleep(500);if(k<1){await animVB(far,1200,tok);await sleep(300)}}}
async function demoScroll(tok){const v0={...vb},d=vb.h*.6;
 for(let k=0;k<2&&tok===gTok;k++){await animVB({...v0,y:v0.y+d},1100,tok);await sleep(250);await animVB(v0,1100,tok);await sleep(250)}}
async function demoSearch(tok){q.value='';const word=t('gWord');if(!TOUCH)q.focus();
 for(const ch of word){if(tok!==gTok)return;q.value+=ch;doSearch();await sleep(160)}
 await sleep(700);if(tok!==gTok)return;const it=items.find(i=>i.id==='michael')||items[0];pick(it);
 await sleep(1500);if(tok!==gTok)return;hideCard();hover('michael');await sleep(2600);if(tok===gTok)hover(null)}
async function demoTap(tok){await animVB(around('michael',TOUCH?480:900),1200,tok);if(tok!==gTok)return;await sleep(400);hover('michael');await sleep(2800);if(tok!==gTok)return;select('michael')}
Object.defineProperty(window,'TOUCH',{get:()=>matchMedia('(hover:none)').matches}); // телефон/планшет без мыши
const mkSteps=()=>TOUCH?[['tZoom',demoZoom,'pinch'],['tPan',demoScroll,'pan'],['tTap',demoTap,'tap'],['tSearch',demoSearch,'tap']]
 :[['gZoom',demoZoom,true],['gScroll',demoScroll,false],['gSearch',demoSearch,false]];
let GSTEPS=mkSteps();
function guideShow(i){if(i===0)GSTEPS=mkSteps();gTok++;const tok=gTok;gStep=i;if(i>=GSTEPS.length){guide.classList.remove('on');store.set('ku-guide','1');return}
 const[txt,fn,ctrl]=GSTEPS[i],last=i===GSTEPS.length-1;guide.classList.toggle('touch',TOUCH);['pinch','pan','tap'].forEach(c=>guide.classList.toggle(c,ctrl===c));['gKey','gKt','gPl'].forEach(id=>document.getElementById(id).classList.toggle('off',!ctrl));
 document.getElementById('gTxt').textContent=t(txt);document.getElementById('gNext').textContent=t(last?'gDone':'gNext');document.getElementById('gSkip').textContent=t('gSkip');
 document.getElementById('gSkip').style.display=last?'none':'';guide.classList.add('on');fn(tok)}
document.getElementById('gNext').onclick=()=>guideShow(gStep+1);document.getElementById('gSkip').onclick=()=>guideShow(GSTEPS.length);
document.getElementById('bHelp').onclick=()=>guideShow(0);document.getElementById('bDemo').onclick=()=>guideShow(0);
['wheel','pointerdown'].forEach(ev=>svg.addEventListener(ev,e=>{if(e.isTrusted&&guide.classList.contains('on'))guideShow(GSTEPS.length)}));
if(!store.get('ku-guide')&&!sel)setTimeout(()=>guideShow(0),900);
/* Запоминаем состояние панели: свёрнута ли, вкладка и галочки типов связей. На телефоне панель при входе всегда свёрнута. */
(()=>{const K='ku-legend',lg=document.getElementById('legend'),ids=['tOrigin','tService','tAscent','tLong'];
 const save=()=>store.set(K,JSON.stringify({min:lg.classList.contains('min'),k:lg.classList.contains('k'),...Object.fromEntries(ids.map(i=>[i,document.getElementById(i).checked]))}));
 let st=null;try{st=JSON.parse(store.get(K))}catch(e){}
 if(st){lg.classList.toggle('min',!!st.min);lg.classList.toggle('k',!!st.k);
  ids.forEach(i=>{const c=document.getElementById(i);if(i in st&&c.checked!==st[i]){c.checked=st[i];c.dispatchEvent(new Event('change'))}})}
 if(MOB.matches)lg.classList.add('min');MOB.addEventListener?.('change',e=>{if(e.matches)lg.classList.add('min')});
 document.getElementById('lgToggle').onclick=()=>{lg.classList.toggle('min');if(MOB.matches&&!lg.classList.contains('min')&&cardShown()){hover(null,0,1);closeCard()}save()};
 lg.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{lg.classList.toggle('k',b.dataset.tab==='k');save()});
 ids.forEach(i=>document.getElementById(i).addEventListener('change',save))})();
