    name: Morontia Companions
    desc: Companions and guides of ascenders on the morontia worlds.
  adjutants:
    name: Adjutant Mind-Spirits
    desc: "The Mother Spirit's ministry to the mind of evolutionary creatures."
  truth:
    name: Spirit of Truth
    desc: "The spirit of the Creator Son, poured out on all mankind after Pentecost."
  midway:
    name: Midway creatures
    desc: "Permanent citizens of the planet, unseen helpers of mankind."
  reflective:
    name: Reflective Spirits
    desc: Fifty Trinity-origin spirits who make reflectivity possible on the superuniverse capitals.
  execs:
    name: Supreme Executives
