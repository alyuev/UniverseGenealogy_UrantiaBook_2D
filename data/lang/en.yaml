  refimage:
    name: Reflective Image Aids
    desc: The Reflective Image Aids represent groups of beings influential in the superuniverse governments.
  circspirits:
    name: Spirits of the Circuits
    desc: "The Spirits of the Circuits, offspring of the Master Spirits, serve the seven circuits of Havona."
  inspired:
    name: Inspired Trinity Spirits
    desc: A wholly secret order of beings brought into existence by the act of the Paradise Trinity.
  havnat:
    name: Havona Natives
    desc: "Havona natives, Trinity-origin personalities projected in divine perfection."
  parcit:
    name: Paradise Citizens
    desc: "Paradise Citizens, Trinity-origin personalities who are permanent residents of Paradise."
  fmelch:
    name: Father Melchizedeks
    desc: "The Father Melchizedek, the original Melchizedek Son of the local universe."
  abandon:
    name: Abandonters
    desc: "Dual-origin beings: the creation of the unrevealed agents of the Ancients of Days and the seven Reflective Spirits of Uversa (37:9). Permanent citizens of the superuniverse capital; they administer the routine affairs of Uversa under the supervision of the Son-fused mortals."
  susatia:
    name: Susatia
    desc: "The Susatia, offspring of the Creator Son and Creative Spirit, permanent citizens of Salvington."
  univit:
    name: Univitatia
    desc: "The Univitatia, the permanent population of the constellation headquarters worlds."
  spironga:
    name: Spironga
    desc: "The Spironga, spirit offspring of the Bright and Morning Star and the Father Melchizedek."
  adjfused:
    name: Adjuster-fused Mortals
    desc: "Adjuster-fused mortals, ascenders destined for Paradise and the Corps of the Finality."
  sonfused:
    name: Son-fused Mortals
    desc: "Son-fused mortals, few in number and restricted to the superuniverse."
  spiritfused:
    name: Spirit-fused Mortals
    desc: "Spirit-fused mortals, generally confined to a local universe."
  transmid:
    name: Translated Midwayers
    desc: "Translated midway creatures, who ascend toward Paradise."
  persadj:
    name: Personalized Adjusters
    desc: "Personalized Adjusters, Adjusters that have experientialized and attained personality."
  gravmess:
    name: Gravity Messengers
    desc: "Gravity Messengers, modified and personalized Adjusters from Divinington."
