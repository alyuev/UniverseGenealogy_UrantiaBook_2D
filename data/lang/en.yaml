    desc: "The Corps of Transcendental Finaliters, a division of the Corps of the Finality."
  mosthigh:
    name: Most High Assistants
    desc: "Most High Assistants, volunteers of outside origin temporarily assigned to the local creations."
  architects:
    name: Architects of the Master Universe
    desc: "The Architects of the Master Universe, the governing corps of the Paradise Transcendentalers."
  transrec:
    name: Transcendental Recorders
    desc: "Transcendental Recorders, personal gravity traversers."
