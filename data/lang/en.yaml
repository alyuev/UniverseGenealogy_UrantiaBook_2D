    serves: in the local systems
  gradguides:
    name: Graduate Guides
    desc: "Graduate Guides, devoted to the guidance of the graduate pilgrims of time and space in Havona."
  servitals:
    name: Havona Servitals
    desc: "Havona Servitals, the midway creatures of the central universe."
  conciliators:
    name: Universal Conciliators
    desc: "Universal Conciliators, seven for every Havona Servital, one in each superuniverse."
  tertiaphim:
    name: Tertiaphim
    desc: "Tertiaphim, the third order of angels serving the grand universe."
  omniaphim:
    name: Omniaphim
    desc: "Omniaphim, the servants and messengers of the Supreme Executives."
    serves: in the superuniverses
  highauth:
    name: Those High in Authority
    desc: "Those High in Authority, ascended mortals of superior administrative ability."
  noname:
    name: Those without Name and Number
    desc: "Those without Name and Number, ascendant souls of unsurpassed worship ability."
  asctrin:
    name: Ascender-trinitized Sons
    desc: "Ascender-trinitized Sons, trinitized through the creative efforts of the finaliters."
  parhav:
    name: Paradise-Havona-trinitized Sons
    desc: "Paradise-Havona-trinitized Sons, born of the creative efforts of Paradise Citizens and Havoners."
  destiny:
    name: Trinitized Sons of Destiny
    desc: "Trinitized Sons of Destiny, trinitized jointly by a finaliter and a Paradise-Havoner."
  sppd:
    name: Supreme Power Directors
    desc: "The Seven Supreme Power Directors, personalized by the Master Spirits, direct universe power."
  supcentsup:
    name: Supreme Center Supervisors
    desc: "First group of the Supreme Power Centers: seven regulators of the master energy circuits of the grand universe, associates of the Supreme Power Directors, each on a special world of one of the Seven Supreme Executives (29:2)."
  havcenters:
    name: Havona Centers
    desc: "Second group of the Supreme Power Centers. Havona once needed no power centers; since the appearance of the time-space universes a million of them function here, each controlling a thousand Havona worlds (29:2)."
  sucenters:
    name: Superuniverse Centers
    desc: "Third group: one thousand power centers on the capital sphere of each superuniverse; from them proceeds the sevenfold energy circuit pervading the supercreation (29:2)."
  lucenters:
    name: Local Universe Centers
    desc: "Fourth group: one hundred centers at the headquarters of each local universe; they downstep and modify the seven power circuits from the superuniverse headquarters (29:2)."
  concenters:
    name: Constellation Centers
    desc: "Fifth group: ten centers in each constellation, energy projectors to its one hundred tributary local systems (29:2)."
  syscenters:
    name: System Centers
    desc: "Sixth group: one Supreme Power Center in each local system; they dispatch the power circuits to the inhabited worlds and co-ordinate the subordinate physical controllers (29:2)."
  assocpd:
    name: Associate Power Directors
    desc: "Associate Power Directors, the first order of Master Physical Controllers."
  mechcon:
    name: Mechanical Controllers
    desc: "Mechanical Controllers, the second order of Master Physical Controllers."
  enertrans:
    name: Energy Transformers
    desc: "Energy Transformers, the third order of Master Physical Controllers."
  energytx:
    name: Energy Transmitters
    desc: Energy Transmitters provide emergency communication lines in the systems and on the planets.
  primassoc:
    name: Primary Associators
    desc: "Primary Associators, the fifth order of Master Physical Controllers."
  secdissoc:
    name: Secondary Dissociators
    desc: "Secondary Dissociators, the sixth order of Master Physical Controllers."
  frandal:
    name: Frandalanks and Chronoldeks
    desc: "Frandalanks and Chronoldeks, the seventh order of Master Physical Controllers."
  circreg:
    name: Circuit Regulators
    desc: Circuit Regulators initiate changes in material energies and generate morontia power.
  syscoord:
    name: System Co-ordinators
    desc: "System Co-ordinators, the second order of Morontia Power Supervisors."
  plancust:
    name: Planetary Custodians
    desc: "Planetary Custodians, the third order of Morontia Power Supervisors."
  combcon:
    name: Combined Controllers
    desc: "Combined Controllers, the fourth order of Morontia Power Supervisors."
  liaisonstab:
    name: Liaison Stabilizers
