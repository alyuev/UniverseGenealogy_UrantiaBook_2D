  persaids:
    name: Personal Aids of the Infinite Spirit
    desc: "Personal Aids of the Infinite Spirit, located on Paradise and attached directly to him."
  associnsp:
    name: Associate Inspectors
    desc: "Joint offspring of the Infinite Spirit and the Seven Master Spirits; subordinates of the Supreme Executives, embodying their authority in the local universes."
    serves: in the local universes
  sentinels:
    name: Assigned Sentinels
