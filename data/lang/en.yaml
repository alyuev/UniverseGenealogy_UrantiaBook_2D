  lifec:
    name: Life Carriers
    desc: Carry and implant life on the evolutionary worlds.
  arch:
    name: Archangels
    desc: Ministry of resurrection; circuit of communication with the worlds.
  lanon:
    name: Lanonandek Sons
    desc: "Administrative sons: System Sovereigns, Planetary Princes."
  adam:
    name: Material Sons
