  eternals:
    name: Eternals of Days
    desc: Rulers of the Havona worlds — one for each world.
  ancients:
    name: Ancients of Days
    desc: The three rulers of each superuniverse.
  perfections:
    name: Perfections of Days
    desc: Rulers of the major sectors of a superuniverse.
  recents:
    name: Recents of Days
    desc: Rulers of the minor sectors of a superuniverse.
  unions:
    name: Unions of Days
