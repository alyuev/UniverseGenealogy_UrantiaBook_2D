    there: Adam
  eve:
    name: Material Daughters
    desc: Material Daughters — biologic uplifters with the Material Sons; the Eve of a planet.
    serves: sent to a planet as its Eve
    there: Eve
  cherub:
    name: Cherubim
    desc: "Aids to the seraphim, lesser angelic ministers."
  tadj:
    name: Thought Adjuster
    desc: A fragment of the Father indwelling the mortal mind.
  human:
    name: Mortal man
    desc: An evolutionary being beginning the ascent to Paradise.
  seraph:
    name: Seraphim
    desc: Ministering angels; guardians of mortal destiny.
  perfectors:
    name: Perfectors of Wisdom
    desc: Embody the wisdom of Deity in superuniverse governments.
  counselors:
    name: Divine Counselors
    desc: Provide the counsel of the Trinity in superuniverse governments.
  censors:
    name: Universal Censors
    desc: Render the judgment of Deity; assess deeds and records.
  mighty:
    name: Mighty Messengers
    desc: Trinity-embraced ascendant mortals serving superuniverse governments.
  solitary:
    name: Solitary Messengers
    desc: Personal corps of the Infinite Spirit; instant communication throughout creation.
  supernaphim:
    name: Supernaphim
    desc: Angels of the central universe and Paradise.
  seconaphim:
    name: Seconaphim
    desc: "Angels of the superuniverses, created through the Reflective Spirits."
  stars:
    name: Brilliant Evening Stars
