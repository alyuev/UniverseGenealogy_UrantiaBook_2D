# aka — другие имена (в карточке и в поиске); serves — подпись к месту служения; there — имя на месте служения (если иное).
persons:
  father:
    name: Universal Father
    desc: "First Source and Center; the personal God, Creator of all."
  son:
    name: Eternal Son
    desc: Second Source and Center; the absolute and personal Word of God.
  spirit:
    name: Infinite Spirit
    desc: "Third Source and Center, the Conjoint Actor; source of mind."
