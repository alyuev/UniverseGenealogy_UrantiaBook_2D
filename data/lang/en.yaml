    name: Associate Transcendental Master Force Organizers
    desc: Associate Transcendental Master Force Organizers.
  consummator:
    name: Consummator of Universe Destiny
    desc: "The Consummator of Universe Destiny, a being of the unclassified and unrevealed orders."
  vicegerents:
    name: Qualified Vicegerents of the Ultimate
    desc: "The Qualified Vicegerents of the Ultimate, an unrevealed group."
  supervisors:
    name: Unqualified Supervisors of the Supreme
    desc: "The Unqualified Supervisors of the Supreme, personalization of time-space supremacy."
  majeston:
    name: Majeston
    desc: "Chief of Reflectivity, resident on Paradise. The only personality of divinity created by the Supreme Being in functional liaison with the Deity Absolute (17:2.4)."
  midsonite:
    name: Midsoniters
    desc: "Midsoniters, the progeny of a Melchizedek life carrier and a Material Daughter."
  unclcenters:
    name: Unclassified Centers
    desc: "Seventh group of the Supreme Power Centers: they function in special local situations, but not on the inhabited planets (29:2)."
  supbeing:
    name: Supreme Being
    aka: God the Supreme
    desc: "The evolving experiential Deity of time and space, the synthesis of creature experience. The creation of Majeston was its first supreme creative act (17:2.5)."
  deityabs:
    name: Deity Absolute
    aka: Qualified Absolute
    desc: "The potential segregated from infinite reality by the free-will choice of the Universal Father, within which all divinity activities take place. This is the Qualified Absolute, in contradistinction to the Unqualified Absolute (0:11.6)."
  unqabs:
    name: Unqualified Absolute
    desc: "Nonpersonal, extradivine, and undeified; devoid of personality, divinity, and creator prerogatives. A positive reality pervading the grand universe and extending into the prematerial evolutions of space (0:11.7–8)."
  univabs:
    name: Universal Absolute
    desc: "Unifies the Qualified and Unqualified Absolutes and is superadditive to both, encompassing all absolute potential (0:3.18, 0:11.6)."
  calstaff:
    name: "Caligastia One Hundred — corporeal members of the Prince's staff"
    desc: "One hundred rematerialized ascending citizens of Jerusem, volunteers chosen by Caligastia for the Urantia experiment (66:2). The primary midwayers had their genesis in their unique interassociation of the material and the spiritual (77:1)."
