  mosthigh:
    name: Всевышние Помощники
    desc: "Всевышние Помощники – добровольцы из-за пределов локальной вселенной, временные наблюдатели."
  architects:
    name: Творцы Совокупной Вселенной
    desc: Творцы Совокупной Вселенной – правящий корпус Райских Трансценденталов.
  transrec:
    name: Трансцендентальные Регистраторы
    desc: "Трансцендентальные Регистраторы – личности, использующие гравитацию для перемещения."
  mfo:
    name: Первичные Возникшие Главные Организаторы Сил
    desc: Первичные Возникшие Главные Организаторы Сил организуют силы пространства.
  amfo:
    name: Ассоциированные Трансцендентальные Главные Организаторы Сил
    desc: Ассоциированные Трансцендентальные Главные Организаторы Сил.
  consummator:
    name: Свершитель Вселенского Пути
    desc: Свершитель Вселенского Пути – из нераскрытых групп Райской Троицы.
  vicegerents:
    name: Условные Наместники Предельного
    desc: Условные Наместники Предельного – нераскрытая группа.
  supervisors:
    name: Безусловные Смотрители Верховного
    desc: Безусловные Смотрители Верховного – персонализация сверхвселенской верховности.
  majeston:
    name: Мажестон
    desc: "Глава Отражательности, живущий в Раю. Единственная личность божественности, созданная Верховным Существом в функциональной связи с Божеством-Абсолютом (17:2.4)."
  midsonite:
    name: Мидсониты
    desc: Мидсониты – потомство Мелхиседека-носителя жизни и Материальной Дочери.
  unclcenters:
    name: Неклассифицированные Центры
    desc: "Седьмая группа Верховных Силовых Центров: действуют в особых локальных ситуациях, но не на обитаемых планетах (29:2)."
  supbeing:
    name: Верховное Существо
    aka: Бог-Верховный
    desc: "Эволюционное (опытное) Божество времени и пространства; синтез опыта творения. Создало Мажестона — своё первое верховное творческое деяние (17:2.5)."
  deityabs:
    name: Божество-Абсолют
    aka: Условный Абсолют
    desc: "Потенциал, выделенный из бесконечной реальности добровольным решением Всеобщего Отца; в его пределах происходит вся божественная деятельность. Это Условный Абсолют, в отличие от Безусловного (0:11.6)."
  unqabs:
    name: Безусловный Абсолют
    desc: "Неличностный, внебожественный и необожествлённый; лишён личности, божественности и прерогатив создателя. Позитивная реальность, наполняющая большую вселенную и простирающаяся в доматериальные области пространства (0:11.7–8)."
  univabs:
    name: Всеобщий Абсолют
    desc: "Объединяет Условный и Безусловный Абсолюты и сверхаддитивен к обоим, охватывая весь абсолютный потенциал (0:3.18, 0:11.6)."
  calstaff:
    name: Калигастийская сотня — телесные члены персонала Князя
    desc: "Сто вновь материализованных восходящих граждан Иерусема, добровольцы, отобранные Калигастией для урантийского эксперимента (66:2). От их взаимосвязи материального и духовного произошли первичные промежуточные создания (77:1)."
