    desc: Райская Троица — союз трёх Божеств. Источник сынов Троицы.
  absolutes:
    name: Абсолюты
  transc:
    name: Возникшие трансцендентальные существа
    desc: "Существа Рая, происхождение которых обычно не раскрывается."
  creattrin:
    name: "Сыны, тринитизованные созданиями"
    desc: Тринитизованы восходящими или райско-хавонскими созданиями.
  trinsons:
    name: Тринитизованные Божьи Сыны
    desc: "Три категории: Сыны Достижения, Отбора и Совершенства."
  trinatt:
    name: Тринитизованные Сыны Достижения
    desc: "Слившиеся с Настройщиками смертные, достигшие Рая и принятые Троицей."
  finaliters:
    name: Корпус Завершения
    desc: "Восходящие, достигшие Рая; предназначение ещё не раскрыто."
  havona:
    name: Хавона — центральная вселенная
  super:
    name: Сверхвселенная Орвонтон
  uversa:
    name: Уверса — столица сверхвселенной
  mpc:
    name: Главные Физические Регуляторы
    desc: Главные Физические Регуляторы служат по всей большой вселенной.
  major:
    name: Большой сектор Спландон
  umajor:
    name: Умейджор-пятый — столица большого сектора
  minor:
    name: Малый сектор Энса
  uminor:
    name: Умайнор-третий — столица малого сектора
  local:
    name: Локальная вселенная Небадон
  salv:
    name: Салвингтон — столица локальной вселенной
  const:
    name: Созвездие Норлатиадек
  edentia:
    name: Эдемия — столица созвездия
  system:
    name: Система Сатания
  jerusem:
    name: Иерусем — столица системы
  mps:
    name: Управляющие Моронтийной Энергией
    desc: Управляющие Моронтийной Энергией – потомки Материнского Духа локальной вселенной.
  urantia:
    name: Урантия — обитаемая планета
  mortal:
    name: Смертный и его Настройщик

# aka — другие имена (в карточке и в поиске); serves — подпись к месту служения; there — имя на месте служения (если иное).
persons:
  father:
    name: Всеобщий Отец
    desc: "Первый Источник и Центр; личный Бог, Творец всего сущего."
  son:
    name: Вечный Сын
    desc: Второй Источник и Центр; абсолютное и личное Слово Бога.
  spirit:
    name: Бесконечный Дух
    desc: "Третий Источник и Центр, Совместный Исполнитель; источник разума."
  msp:
    name: Семь Главных Духов
    desc: Личностные выражения Божеств в семи сочетаниях; каждый курирует одну сверхвселенную.
  secrets:
    name: Тринитизованные Тайны Верховности
    desc: Управляют семью священными сферами Отца у Рая.
  eternals:
    name: Вечные Дней
    desc: Правители миров Хавоны — по одному на каждый мир.
  ancients:
    name: Древние Дней
    desc: Трое правителей каждой сверхвселенной.
  perfections:
    name: Совершенства Дней
    desc: Правители больших секторов сверхвселенной.
  recents:
    name: Недавние Дней
    desc: Правители малых секторов сверхвселенной.
  unions:
    name: Союзы Дней
    desc: Советники-послы Троицы при правительстве локальной вселенной.
  faithfuls:
    name: Верные Дней
    desc: Советники Троицы при правителях созвездий.
  daynal:
    name: Троичные Сыны-Учителя
    aka: Дайналы
    desc: "Райские Божьи Сыны, учителя миров и рас; служат в локальных вселенных."
    serves: учителя миров и рас в локальной вселенной
  michael:
    name: Сыны-Создатели
    aka: Михаилы
    desc: Создатели и правители локальных вселенных; Михаил Небадонский воплотился как Иисус.
    serves: правит своей локальной вселенной
  avonal:
    name: Сыны-Арбитры
    aka: Авоналы
    desc: "Райские Божьи Сыны служения: судебные действия и посвящения на мирах."
    serves: Райские Сыны служения и посвящений на планетах
  mother:
    name: Материнский Дух локальной вселенной
    desc: Созидательный Дух — дочь Бесконечного Духа в Раю; в локальной вселенной — соправительница Сына-Создателя.
    serves: соправительница локальной вселенной
  gabriel:
    name: Светлая Утренняя Звезда
    aka: Гавриил
    desc: "Яркая Утренняя Звезда — первенец, главный исполнитель Небадона."
  melch:
    name: Мелхиседеки
    desc: Сыны-учителя и чрезвычайные служители локальной вселенной.
    serves: непосредственно служат эволюционным расам
  lifec:
    name: Носители жизни
    desc: Переносят и насаждают жизнь на эволюционных мирах.
  arch:
    name: Архангелы
    desc: Служение воскрешения и пробуждения; цепь связи с мирами.
  lanon:
    name: Ланонандеки
    desc: "Административные сыны: Системные Суверены, Планетарные Князья."
  adam:
    name: Материальные Сыны
    desc: "Биологические возвысители; созданы Сыном-Создателем, живут на столице системы. Посылаются на планету как Адам."
    serves: посылается на планету как Адам
    there: Адам
  eve:
    name: Материальные Дочери
    desc: Биологические возвысители вместе с Материальными Сынами. Посылаются на планету как Ева.
    serves: посылается на планету как Ева
    there: Ева
  cherub:
    name: Херувимы и сановимы
    desc: Помощники серафимов; младшие ангельские служители.
  tadj:
    name: Настройщик Мышления
    desc: "Фрагмент Отца, пребывающий в разуме смертного."
  human:
    name: Человек (смертный)
    desc: "Эволюционное существо, начинающее восхождение к Раю."
  seraph:
    name: Серафимы
    desc: Ангелы-служители; хранители судьбы смертных.
  perfectors:
    name: Совершенствователи Мудрости
    desc: Олицетворяют мудрость Божества в правительствах сверхвселенных.
  counselors:
    name: Божественные Советники
    desc: Носители совета Троицы в правительствах сверхвселенных.
  censors:
    name: Всеобщие Цензоры
    desc: Выносят суждение Божества; оценивают дела и записи.
  mighty:
    name: Могущественные Посланники
    desc: "Восходящие смертные, объятые Троицей; служат при правительствах сверхвселенных."
  solitary:
    name: Одиночные Посланники
    desc: Личный корпус Бесконечного Духа; мгновенная связь по всему творению.
  supernaphim:
    name: Супернафимы
    desc: Ангелы центральной вселенной и Рая.
  seconaphim:
    name: Секонафимы
    desc: "Ангелы сверхвселенных, создаются через Отражательных Духов."
  stars:
    name: Яркие Вечерние Звезды
    desc: Сверхангельские администраторы и посланники локальной вселенной.
  vorondadek:
    name: Ворондадеки (Всевышние)
    desc: "Правители созвездий, «Всевышние Отцы»."
  morontia:
    name: Моронтийные смертные
    desc: Восходящие на обительских мирах после смерти; моронтийная форма.
  mcomp:
    name: Моронтийные Спутники
    desc: Спутники и проводники восходящих на моронтийных мирах.
  adjutants:
    name: Семь вспомогательных духов разума
    desc: Служение Материнского Духа разуму эволюционных существ.
  truth:
    name: Дух Истины
    desc: "Дух Сына-Создателя, излитый на всех людей после Пятидесятницы."
  midway:
    name: Промежуточные создания
    desc: "Постоянные граждане планеты, невидимые помощники людей."
  reflective:
    name: Отражательные Духи
    desc: "Пятьдесят Духов троичного происхождения, обеспечивающих отражательность сверхвселенных."
  execs:
    name: Верховные Администраторы
    desc: Семь Верховных Администраторов управляют семью сверхвселенными из Рая.
    serves: в сверхвселенных
  refimage:
    name: Вспомогательные Образы Отражения
    desc: Вспомогательные Образы Отражения представляют группы существ в правительствах сверхвселенных.
  circspirits:
    name: Кольцевые Духи
    desc: "Кольцевые Духи – потомство Главных Духов, служащие семи кольцам Хавоны."
  inspired:
    name: Вдохновенные Троичные Духи
    desc: "Тайный орден существ, возникших по акту Райской Троицы."
  havnat:
    name: Уроженцы Хавоны
    desc: Уроженцы Хавоны воплощаются в божественном совершенстве как существа троичного происхождения.
  parcit:
    name: Граждане Рая
    desc: "Граждане Рая – существа троичного происхождения, постоянные жители Рая."
  fmelch:
    name: Отцы-Мелхиседеки
    desc: "Отец-Мелхиседек – первый, исходный Сын-Мелхиседек локальной вселенной."
  abandon:
    name: Абандонтеры
    desc: "Существа двуединого происхождения: сотворены нераскрытыми посредниками Древних Дней и семью Отражательными Духами Уверсы (37:9). Постоянные граждане столицы сверхвселенной; повседневными делами Уверсы ведают под надзором смертных, слившихся с Сыном."
  susatia:
    name: Сузаты
    desc: "Сузаты – потомство Сына-Создателя и Созидательного Духа, граждане Сальвингтона."
  univit:
    name: Унивитаты
    desc: Унивитаты – постоянное население столиц созвездий и их миров.
  spironga:
    name: Спиронги
    desc: Спиронги – духовное потомство Светлой Утренней Звезды и Отца-Мелхиседека.
  adjfused:
    name: "Смертные, слившиеся с Настройщиком"
    desc: "Смертные, слившиеся с Настройщиком, – восходящие к Раю и Корпусу Завершения."
  sonfused:
    name: "Смертные, слившиеся с Сыном"
    desc: "Смертные, слившиеся с Сыном, малочисленны и ограничены сверхвселенной."
  spiritfused:
    name: "Смертные, слившиеся с Духом"
    desc: "Смертные, слившиеся с Духом, обычно ограничены локальной вселенной."
  transmid:
    name: Преобразованные промежуточные создания
    desc: Преобразованные промежуточные создания – восходящие бывшие промежуточные создания.
  persadj:
    name: Личностные Настройщики
    desc: Личностные Настройщики – обретшие личность и опыт Настройщики.
  gravmess:
    name: Гравитационные Посланники
    desc: Гравитационные Посланники – видоизмененные и персонализированные Настройщики из Дивинингтона.
    serves: на Уверсе
  adjhav:
    name: Двенадцатичастные Кольцевые Помощники Хавоны
    desc: Двенадцатичастные Кольцевые Помощники Хавоны служат на кольцах центральной вселенной.
  circsup:
    name: Смотрители Вселенских Контуров
    desc: Смотрители Вселенских Контуров – исключительное творение Бесконечного Духа.
  census:
    name: Регистраторы Волевых Созданий
    desc: Регистраторы Волевых Созданий отмечают появление и смерть волевых созданий.
  persaids:
    name: Личные Помощники Бесконечного Духа
    desc: Личные Помощники находятся при Бесконечном Духе на Рае и служат ему повсюду.
  associnsp:
    name: Ассоциированные Инспекторы
    desc: Совместное потомство Бесконечного Духа и Семи Главных Духов; подчинены Верховным Администраторам и представляют их власть в локальных вселенных.
    serves: в локальных вселенных
  sentinels:
    name: Полномочные Стражи
    desc: Сотворены Бесконечным Духом в Раю; координаторы и связные Семи Верховных Администраторов в локальных системах.
    serves: в локальных системах
  gradguides:
    name: Проводники смертных кандидатов
    desc: Проводники смертных кандидатов наставляют выпускников времени и пространства в Хавоне.
  servitals:
    name: Хавонские сервиталы
    desc: Хавонские сервиталы – «промежуточные создания» центральной вселенной.
  conciliators:
    name: Всеобщие примирители
    desc: "Всеобщие примирители – семь на каждого хавонского сервитала, по одному в сверхвселенной."
  tertiaphim:
    name: Тертиафимы
    desc: "Тертиафимы – третий порядок ангелов, служащих во всей большой вселенной."
  omniaphim:
    name: Омниафимы
    desc: Омниафимы – слуги и посланники Верховных Администраторов.
    serves: в сверхвселенных
  highauth:
    name: Наделенные Высокими Полномочиями
    desc: Наделенные Высокими Полномочиями – смертные с выдающимися административными способностями.
  noname:
    name: Не Имеющие Имени и Числа
    desc: "Не Имеющие Имени и Числа – восходящие души, превзошедшие всех в способности к поклонению."
  asctrin:
    name: "Сыны, тринитизованные восходящими созданиями"
    desc: "Сыны, тринитизованные восходящими созданиями, – творение завершителей."
  parhav:
    name: "Сыны, тринитизованные в системе Рай-Хавона"
    desc: "Сыны, тринитизованные в системе Рай-Хавона, – творение Граждан Рая и обитателей Хавоны."
  destiny:
    name: Тринитизованные сыны судьбы
    desc: Тринитизованные сыны судьбы – совместное творение завершителя и существа системы Рай-Хавона.
  sppd:
    name: Верховные Управляющие Энергией
    desc: Семь Верховных Управляющих Энергией руководят энергиями большой вселенной.
  supcentsup:
    name: Верховные Управляющие Центрами
    desc: "Первая группа Верховных Силовых Центров: семь регуляторов главных энергетических контуров большой вселенной, партнёры Верховных Управляющих Энергией; каждый — на особом мире одного из Семи Верховных Администраторов (29:2)."
  havcenters:
    name: Хавонские Центры
    desc: "Вторая группа Верховных Силовых Центров. Когда-то Хавоне не требовались силовые центры; с появлением вселенных времени и пространства здесь действует миллион центров, каждый контролирует тысячу миров Хавоны (29:2)."
  sucenters:
    name: Центры сверхвселенных
    desc: "Третья группа: тысяча силовых центров на столичной сфере каждой сверхвселенной; отсюда исходит семичастный контур энергии, пронизывающий сверхвселенную (29:2)."
  lucenters:
    name: Центры локальных вселенных
    desc: "Четвёртая группа: сто центров на столице каждой локальной вселенной; понижают и видоизменяют семь силовых контуров, приходящих из столицы сверхвселенной (29:2)."
  concenters:
    name: Центры созвездий
    desc: "Пятая группа: десять центров в каждом созвездии — проекторы энергии для ста входящих в него локальных систем (29:2)."
  syscenters:
    name: Центры систем
    desc: "Шестая группа: по одному Верховному Силовому Центру в каждой локальной системе; направляют силовые контуры к обитаемым мирам и координируют работу физических регуляторов (29:2)."
  assocpd:
    name: Ассоциированные управляющие энергией
    desc: Ассоциированные управляющие энергией – первая категория Физических Регуляторов.
  mechcon:
    name: Механические регуляторы
    desc: Механические регуляторы – вторая категория Физических Регуляторов.
  enertrans:
    name: Преобразователи энергии
    desc: Преобразователи энергии – третья категория Физических Регуляторов.
  energytx:
    name: Передатчики энергии
    desc: Передатчики энергии обеспечивают каналы экстренной связи в системах и на планетах.
  primassoc:
    name: Первичные объединители
    desc: Первичные объединители – пятая категория Физических Регуляторов.
  secdissoc:
    name: Вторичные разъединители
    desc: Вторичные разъединители – шестая категория Физических Регуляторов.
  frandal:
    name: Франдаланки и хронолдеки
    desc: Франдаланки и хронолдеки – седьмая категория Физических Регуляторов.
  circreg:
    name: Регуляторы контуров
    desc: Регуляторы контуров подчиняют материальную энергию управлению и генерируют моронтийную энергию.
  syscoord:
