# Космология Книги Урантии — структура (без текстов).
# Тексты (имена, описания) — в data/lang/<язык>.yaml. Новый язык = скопировать en.yaml и перевести.
# Проверка: python tools/validate.py   Сборка: python tools/build.py

meta:
  version: "1.2.3"
  base_language: en   # если перевода нет, показывается en, затем ru

# Класс по происхождению: ровно один у личности, задаёт тон заливки карточки.
classes:
  T: { color: "#8e44ad" }
  A: { color: "#ffffff" }
  F: { color: "#e53935" }
  S: { color: "#1e63d6" }
  FS: { color: "#5c4ee5" }
  SD: { color: "#0f9d8a" }
  D: { color: "#f08c00" }
  L: { color: "#c2408f" }
  DU: { color: "#8d6e63" }
  E: { color: "#43a047" }
  X: { color: "#b0bec5" }
  U: { color: "#e0e0e0" }
  C: { color: "#a5d6a7" }

# Группы по роли: у личности может быть несколько; полоски сверху карточки.
groups:
  deity: { color: "#b71c1c" }
  trin: { color: "#7b3fa0" }
  supreme: { color: "#283593" }
  par: { color: "#1565c0" }
  desc: { color: "#00897b" }
  local: { color: "#8d6e63" }
  spirit: { color: "#ef6c00" }
  angel: { color: "#ec407a" }
  asc: { color: "#2e7d32" }
  coord: { color: "#3949ab" }
  supspirit: { color: "#00695c" }
  stationary: { color: "#795548" }
  unclass: { color: "#616161" }
  powercenters: { color: "#e65100" }
  transcg: { color: "#78909c" }
  finality: { color: "#2e7d32" }

# Функции (служебные обязанности): у личности может быть несколько (поле func); фильтр в легенде.
functions:
  gov: { color: "#c62828" }
  justice: { color: "#6d4c41" }
  teach: { color: "#1565c0" }
  messeng: { color: "#00838f" }
  minist: { color: "#ec407a" }
  create: { color: "#f9a825" }
  energy: { color: "#ef6c00" }
  reflect: { color: "#7b1fa2" }

# Дерево административных единиц. content сверху вниз:
#   [a, b, c] — ряд личностей;  - id: … — вложенный блок (столица первой).
#   ~a — «тень» личности a: место, где она служит (сама она стоит на уровне происхождения).
units:
  - id: paradise
    color: "#d4a000"
    content:
      - id: trinity
        color: "#7b3fa0"
        width: 760
        linkable: true
        refs: ["10"]
        content:
          - [father, son, spirit]
      - id: absolutes
        color: "#9aa1ad"
        width: 760
        beside: true
        refs: ["0:11"]
        content:
          - [deityabs, univabs, unqabs]
      - [msp, supbeing]
      - [michael, mother, avonal, daynal]
      - [secrets, solitary]
      - [execs, inspired, parcit]
      - [persadj, gravmess, persaids, associnsp]
      - [sentinels, omniaphim]
      - [sppd, supcentsup, spiritnat, fathernat, adjcit]
      - [majeston]
      - id: transc
        color: "#7a7a8c"
        linkable: true
        refs: ["30:1"]
        content:
          - [architects, transrec, mfo, amfo, consummator, vicegerents]
          - [supervisors]
      - id: creattrin
        color: "#8e44ad"
        width: 730
        linkable: true
        refs: ["22:9"]
        content:
          - [asctrin, parhav, destiny]
      - id: trinsons
        color: "#8e44ad"
        width: 550
        linkable: true
        refs: ["22"]
        content:
          - id: trinatt
            color: "#43a047"
            width: 490
            linkable: true
            refs: ["22:1"]
            content:
              - [highauth, noname]
      - id: finaliters
        color: "#43a047"
        linkable: true
        refs: ["31"]
        content:
          - [mortfin, parfin, trinfin, conjfin, havfin, transfin]
      - [adjfused, transmid]
  - id: havona
    color: "#c08a1e"
    content:
      - [eternals, supernaphim]
      - [circspirits, havnat, adjhav, gradguides, servitals, havcenters]
  - id: super
    color: "#2f6fb3"
    content:
      - id: uversa
        color: "#2f6fb3"
        content:
          - [ancients]
          - [perfectors, counselors, censors]
          - [mighty, seconaphim]
          - [reflective, refimage, abandon, sonfused, circsup, census]
          - [conciliators, tertiaphim, sucenters]
          - [~execs, ~gravmess, ~omniaphim]
          - id: mpc
            color: "#f08c00"
            linkable: true
            refs: ["29:4"]
            content:
              - [assocpd, mechcon, enertrans, energytx, primassoc, secdissoc]
              - [frandal]
      - id: major
        color: "#3f87c9"
        content:
          - id: umajor
            color: "#3f87c9"
            content:
              - [perfections]
          - id: minor
            color: "#3f87c9"
            content:
              - id: uminor
                color: "#3f87c9"
                content:
                  - [recents]
              - id: local
                color: "#7e57c2"
                content:
                  - id: salv
                    color: "#7e57c2"
                    content:
                      - [~michael, ~mother]
                      - [unions, ~daynal]
                      - [gabriel, stars, melch, lifec, arch]
                      - [fmelch, susatia, spironga, spiritfused, lucenters, unclcenters]
                      - [mosthigh]
                      - [~associnsp]
                  - id: const
                    color: "#9c6fd6"
                    content:
                      - id: edentia
                        color: "#9c6fd6"
                        content:
                          - [faithfuls, vorondadek]
                          - [univit, concenters]
                      - id: system
                        color: "#2e8b57"
                        content:
                          - id: jerusem
                            color: "#2e8b57"
                            content:
                              - [lanon, adam, eve, cherub]
                              - [morontia, mcomp]
                              - [syscenters]
                              - [midsonite]
                              - [~sentinels]
                              - id: mps
                                color: "#c2408f"
                                linkable: true
                                refs: ["48:2"]
                                content:
                                  - [circreg, syscoord, plancust, combcon, liaisonstab, selassort]
                                  - [assocreg]
                          - id: urantia
                            color: "#00838f"
                            content:
                              - [~adam, ~eve, ~avonal, ~melch]
                              - [truth, adjutants, seraph, calstaff, midway]
                              - id: mortal
                                color: "#00838f"
                                content:
                                  - [tadj, human]

